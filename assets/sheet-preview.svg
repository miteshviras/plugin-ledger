    <text class="m" x="610" y="134">Use when editing or reviewing prose for AI tells…</text>
    <rect x="968" y="120" width="84" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="1010" y="135" text-anchor="middle" style="fill:#137333">Installed</text>
  </g>
  <g>
    <text class="n" x="16" y="168">claude-seo@agricidaniel-claude-seo</text><text x="300" y="168">plugin</text><text x="365" y="168">Claude Code</text><text x="510" y="168">2026-11-13</text>
    <text class="m" x="610" y="168">seo-audit: Run a full-site SEO audit and return a…</text>
    <rect x="968" y="154" width="84" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="1010" y="169" text-anchor="middle" style="fill:#137333">Installed</text>
  </g>
