    <text class="m" x="610" y="236">Read first to make, edit, animate or render any video…</text>
    <rect x="968" y="222" width="84" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="1010" y="237" text-anchor="middle" style="fill:#137333">Installed</text>
  </g>
  <g>
    <rect x="0" y="248" width="1100" height="34" fill="#EEF3F8"/>
    <text class="n" x="16" y="270">gemini:mcp:Neon</text><text x="300" y="270">mcp</text><text x="365" y="270">Gemini CLI</text><text x="510" y="270">2026-11-23</text>
    <text class="m" x="610" y="270">MCP server (remote) · https://mcp.neon.tech/mcp</text>
