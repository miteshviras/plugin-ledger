    <rect class="flipBg" x="968" y="290" width="84" height="22" rx="11" fill="#D9F2E3"/>
    <text class="pill ins" x="1010" y="305" text-anchor="middle" style="fill:#137333">Installed</text>
    <text class="pill rem" x="1010" y="305" text-anchor="middle" style="fill:#A50E0E">Removed</text>
  </g>
  <g class="new">
    <rect x="0" y="316" width="1100" height="34" fill="#EEF3F8"/>
    <text class="n" x="16" y="338">rea-video@rea-video</text><text x="300" y="338">plugin</text><text x="365" y="338">Claude Code</text><text x="510" y="338">2026-11-22</text>
    <text class="m" x="610" y="338">Use when the user shares a reference video and asks…</text>
    <rect x="968" y="324" width="84" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="1010" y="339" text-anchor="middle" style="fill:#137333">Installed</text>
  </g>

  <line x1="0" y1="350" x2="1100" y2="350" stroke="#E2E8F0"/>
  <text x="16" y="390" class="m">+ link, description and removed-date columns · filters on every column · new installs appear at the bottom</text>
</svg>
