<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t d">
  <title id="t">Example plugin-ledger sheet</title>
  <desc id="d">An example plugin ledger: plugins, skills and MCP servers from Claude Code, Antigravity, Gemini CLI, shared skills and Copilot, each with type, agent, install date, use case and an Installed or Removed status.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 13px; fill: #1E293B; }
      .h { font-weight: 700; fill: #FFFFFF; }
      .n { font-weight: 600; }
      .m { fill: #64748B; }
      .pill { font-size: 11.5px; font-weight: 700; }
      .new { animation: newrow 6s ease-in-out infinite; }
      @keyframes newrow { 0%, 10% { opacity: 0; transform: translateY(-6px) } 22%, 100% { opacity: 1; transform: translateY(0) } }
      .flipBg { animation: flipBg 6s ease-in-out infinite; }
      .ins { animation: ins 6s step-end infinite; }
      .rem { animation: rem 6s step-end infinite; opacity: 0; }
      @keyframes flipBg { 0%, 45% { fill: #D9F2E3 } 52%, 100% { fill: #FCE1E1 } }
      @keyframes ins { 0% { opacity: 1 } 48% { opacity: 0 } }
      @keyframes rem { 0% { opacity: 0 } 48% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .new, .flipBg, .ins, .rem { animation: none } }
    </style>
  </defs>

  <!-- window -->
  <rect width="1100" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect width="1100" height="44" rx="14" fill="#F1F5F9"/>
  <rect y="30" width="1100" height="14" fill="#F1F5F9"/>
  <rect x="18" y="11" width="22" height="22" rx="4" fill="#34A853"/>
  <rect x="23" y="16" width="12" height="12" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <path d="M23 22 h12 M29 16 v12" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="50" y="27" style="font-size:15px;font-weight:600">plugin-ledger</text>
  <text x="1082" y="27" text-anchor="end" class="m">Example data</text>

  <!-- header -->
  <rect x="0" y="44" width="1100" height="34" fill="#1F3A5F"/>
  <text class="h" x="16"  y="66">Plugin name</text>
  <text class="h" x="300" y="66">Type</text>
  <text class="h" x="365" y="66">Agent</text>
  <text class="h" x="510" y="66">Installed</text>
  <text class="h" x="610" y="66">Use case</text>
  <text class="h" x="980" y="66">Status</text>

  <!-- rows (34px each) -->
  <g>
