    <text class="m" x="610" y="202">Prototype, build &amp; run modern apps with Firebase…</text>
    <rect x="968" y="188" width="84" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="1010" y="203" text-anchor="middle" style="fill:#137333">Installed</text>
  </g>
  <g>
