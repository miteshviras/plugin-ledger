<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">How plugin-ledger works</title>
  <desc id="d">At session start, a hook scans every coding agent, then writes an Excel ledger locally or hands changes to Claude for a Google Sheet. CSV and JSON exports happen only on demand.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .h  { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .s  { font-size: 12.5px; fill: #CBD5E1; }
      .hd { font-size: 16px; font-weight: 700; fill: #1F3A5F; }
      .sd { font-size: 12.5px; fill: #475569; }
      .wire { fill: none; stroke: #64748B; stroke-width: 2.5; stroke-dasharray: 7 7; animation: flow 1.2s linear infinite; }
      .wire.slow { animation-duration: 2.4s; stroke-opacity: .7; }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      @keyframes glow { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes ping { 0% { transform: scale(.6); opacity: .9 } 80%, 100% { transform: scale(1.9); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .wire, .glow, .ping { animation: none } }
    </style>
  </defs>

  <!-- 1. agents -->
  <g transform="translate(10 100)">
    <rect width="230" height="100" rx="18" fill="#1F3A5F"/>
    <text class="h" x="20" y="38">Your coding agents</text>
    <text class="s" x="20" y="62">Claude Code · Antigravity · Gemini</text>
    <text class="s" x="20" y="80">opencode · Copilot · Codex</text>
  </g>

  <!-- 2. hook -->
  <g transform="translate(330 100)">
    <rect width="250" height="100" rx="18" fill="#1F3A5F"/>
    <circle class="ping" cx="226" cy="24" r="6" fill="#7DD3FC"/>
    <circle cx="226" cy="24" r="5" fill="#7DD3FC"/>
    <text class="h" x="20" y="38">Session-start hook</text>
    <text class="s" x="20" y="62">scans plugins, skills, MCP servers</text>
    <text class="s" x="20" y="80">diffs against ledger.json</text>
  </g>

  <!-- 3. outputs -->
  <g transform="translate(680 18)">
    <rect width="310" height="74" rx="16" fill="#EEF3F8" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="16" y="20" width="34" height="34" rx="8" fill="#137333"/>
    <text x="33" y="43" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#FFFFFF">X</text>
    <text class="hd" x="64" y="34">Excel ledger · local</text>
    <text class="sd" x="64" y="54">written by the hook, zero tokens</text>
  </g>
  <g transform="translate(680 113)">
    <rect width="310" height="74" rx="16" fill="#EEF3F8" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="16" y="20" width="34" height="34" rx="8" fill="#34A853"/>
    <rect x="24" y="28" width="18" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M24 37 h18 M33 28 v18" stroke="#FFFFFF" stroke-width="2"/>
    <text class="hd" x="64" y="34">Google Sheet · Drive</text>
    <text class="sd" x="64" y="54">Claude syncs it via connectors</text>
  </g>
  <g transform="translate(680 208)">
    <rect width="310" height="74" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="16" y="20" width="34" height="34" rx="8" fill="#64748B"/>
    <text x="33" y="42" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#FFFFFF">{ }</text>
    <text class="hd" x="64" y="34">CSV / JSON export</text>
    <text class="sd" x="64" y="54">only when you run /plugin-ledger:export</text>
  </g>

  <!-- wires -->
  <path class="wire" d="M240 150 H322" marker-end="url(#arrow)"/>
  <path class="wire" d="M580 150 C630 150 630 55 672 55" marker-end="url(#arrow)"/>
  <path class="wire" d="M580 150 H672" marker-end="url(#arrow)"/>
  <path class="wire slow" d="M580 150 C630 150 630 245 672 245" marker-end="url(#arrow)"/>
  <text class="glow" x="600" y="296" text-anchor="middle" style="font-size:12px;fill:#64748B">you choose the destination and name once, at setup</text>
</svg>
