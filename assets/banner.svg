<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">plugin-ledger</title>
  <desc id="d">Never forget what an AI plugin is for. A ledger of every plugin, skill and MCP server across Claude Code, Antigravity, Gemini CLI, opencode, Copilot and Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3A5F"/>
      <stop offset="1" stop-color="#0F1E33"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5A92"/>
      <stop offset="1" stop-color="#1A3354"/>
    </linearGradient>
    <linearGradient id="prong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity=".06"/>
    </pattern>
    <clipPath id="page"><rect x="62" y="64" width="132" height="150" rx="14"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 68px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1px; }
      .tag   { font-size: 26px; fill: #CBD5E1; }
      .chip rect { fill: #FFFFFF; fill-opacity: .08; stroke: #FFFFFF; stroke-opacity: .22; }
      .chip text { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .cell  { font-size: 15px; font-weight: 600; fill: #1E293B; }
      .sub   { font-size: 11px; fill: #64748B; }
      .pill  { font-size: 11px; font-weight: 700; }

      /* 8s loop: logo rows write in, chips fade up, ledger rows slide in, the last row flips to Removed. */
      .line { transform-box: fill-box; transform-origin: left center; animation: write 8s ease-out infinite; }
      .dot  { transform-box: fill-box; transform-origin: center; animation: pop 8s ease-out infinite; }
      .chip { animation: rise 8s ease-out infinite; opacity: 0; }
      .row  { animation: slide 8s cubic-bezier(.2,.8,.2,1) infinite; opacity: 0; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .3s } .d3 { animation-delay: .45s }
      .d4 { animation-delay: .6s }  .d5 { animation-delay: .75s } .d6 { animation-delay: .9s }
      .flipFill { animation: flipFill 8s ease-in-out infinite; }
      .flipDot  { animation: flipDot 8s ease-in-out infinite; }
      .txtIn  { animation: txtIn 8s step-end infinite; }
      .txtOut { animation: txtOut 8s step-end infinite; opacity: 0; }
      .spark { animation: spark 2.4s ease-in-out infinite; }
      @keyframes write { 0%, 6% { transform: scaleX(0) } 16%, 94% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
      @keyframes pop   { 0%, 12% { transform: scale(0) } 18% { transform: scale(1.25) } 22%, 94% { transform: scale(1) } 100% { transform: scale(0) } }
      @keyframes rise  { 0%, 10% { opacity: 0; transform: translateY(8px) } 20%, 94% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
      @keyframes slide { 0%, 14% { opacity: 0; transform: translateX(24px) } 26%, 94% { opacity: 1; transform: translateX(0) } 100% { opacity: 0 } }
      @keyframes flipFill { 0%, 58% { fill: #D9F2E3 } 64%, 94% { fill: #FCE1E1 } 100% { fill: #D9F2E3 } }
      @keyframes flipDot  { 0%, 58% { fill: #34A853 } 64%, 94% { fill: #EA4335 } 100% { fill: #34A853 } }
      @keyframes txtIn  { 0% { opacity: 1 } 61% { opacity: 0 } 100% { opacity: 1 } }
      @keyframes txtOut { 0% { opacity: 0 } 61% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes spark { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .line, .dot, .chip, .row, .flipFill, .flipDot, .txtIn, .txtOut, .spark { animation: none; opacity: 1 }
        .txtOut { opacity: 0 }
      }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>

  <!-- logo -->
  <g transform="translate(52 72)">
    <rect width="256" height="256" rx="58" fill="url(#tile)"/>
    <rect x="98" y="30" width="16" height="40" rx="5" fill="url(#prong)"/>
    <rect x="142" y="30" width="16" height="40" rx="5" fill="url(#prong)"/>
    <circle class="spark" cx="128" cy="40" r="5" fill="#7DD3FC"/>
    <rect x="62" y="64" width="132" height="150" rx="14" fill="#FFFFFF"/>
    <g clip-path="url(#page)">
      <rect x="62" y="64" width="132" height="30" fill="#1F3A5F"/>
      <rect x="62" y="94" width="14" height="120" fill="#E2E8F0"/>
      <rect x="78" y="122" width="116" height="22" fill="#EEF3F8"/>
      <rect x="78" y="166" width="116" height="22" fill="#EEF3F8"/>
    </g>
    <rect x="84" y="76" width="54" height="7" rx="3.5" fill="#FFFFFF" opacity=".9"/>
    <rect x="148" y="76" width="30" height="7" rx="3.5" fill="#FFFFFF" opacity=".55"/>
    <rect class="line"    x="86" y="106" width="64" height="8" rx="4" fill="#94A3B8"/>
    <rect class="line d1" x="86" y="129" width="52" height="8" rx="4" fill="#94A3B8"/>
    <rect class="line d2" x="86" y="152" width="70" height="8" rx="4" fill="#94A3B8"/>
    <rect class="line d3" x="86" y="173" width="46" height="8" rx="4" fill="#94A3B8"/>
    <circle class="dot"    cx="174" cy="110" r="7" fill="#34A853"/>
    <circle class="dot d1" cx="174" cy="133" r="7" fill="#34A853"/>
    <circle class="dot d2" cx="174" cy="156" r="7" fill="#34A853"/>
    <circle class="dot d3 flipDot" cx="174" cy="177" r="7" fill="#34A853"/>
  </g>

  <!-- title -->
  <text class="title" x="350" y="168">plugin-ledger</text>
  <text class="tag" x="352" y="212">Never forget what an AI plugin is for.</text>

  <!-- agents it reads -->
  <g transform="translate(352 252)">
    <g class="chip">   <rect width="108" height="34" rx="17"/><text x="54" y="22" text-anchor="middle">Claude Code</text></g>
    <g class="chip d1"><rect x="118" width="104" height="34" rx="17"/><text x="170" y="22" text-anchor="middle">Antigravity</text></g>
    <g class="chip d2"><rect x="232" width="98" height="34" rx="17"/><text x="281" y="22" text-anchor="middle">Gemini CLI</text></g>
    <g class="chip d3"><rect x="340" width="88" height="34" rx="17"/><text x="384" y="22" text-anchor="middle">opencode</text></g>
    <g class="chip d4"><rect x="438" width="80" height="34" rx="17"/><text x="478" y="22" text-anchor="middle">Copilot</text></g>
    <g class="chip d5"><rect x="528" width="70" height="34" rx="17"/><text x="563" y="22" text-anchor="middle">Codex</text></g>
  </g>
  <text class="sub" x="354" y="318" fill="#94A3B8" style="fill:#94A3B8;font-size:14px">plugins · skills · MCP servers  →  Excel · Google Sheet · CSV / JSON export</text>

  <!-- mini ledger -->
  <g transform="translate(990 78)">
    <rect width="242" height="244" rx="16" fill="#FFFFFF"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h210 a16 16 0 0 1 16 16 v22 h-242 z" fill="#1F3A5F"/>
    <text x="16" y="25" style="font-size:12px;font-weight:700;fill:#FFFFFF">Plugin</text>
    <text x="226" y="25" text-anchor="end" style="font-size:12px;font-weight:700;fill:#FFFFFF">Status</text>

    <g class="row">
      <text class="cell" x="16" y="66">postman</text><text class="sub" x="16" y="81">Claude Code · plugin</text>
      <rect x="150" y="56" width="76" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="188" y="71" text-anchor="middle" fill="#137333">Installed</text>
    </g>
    <g class="row d1">
      <rect x="0" y="94" width="242" height="50" fill="#EEF3F8"/>
      <text class="cell" x="16" y="116">firebase</text><text class="sub" x="16" y="131">Antigravity · plugin</text>
      <rect x="150" y="106" width="76" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="188" y="121" text-anchor="middle" fill="#137333">Installed</text>
    </g>
    <g class="row d2">
      <text class="cell" x="16" y="166">hyperframes</text><text class="sub" x="16" y="181">Shared · skill</text>
      <rect x="150" y="156" width="76" height="22" rx="11" fill="#D9F2E3"/><text class="pill" x="188" y="171" text-anchor="middle" fill="#137333">Installed</text>
    </g>
    <g class="row d3">
      <path d="M0 194 h242 v34 a16 16 0 0 1 -16 16 h-210 a16 16 0 0 1 -16 -16 z" fill="#EEF3F8"/>
      <text class="cell" x="16" y="216">Neon</text><text class="sub" x="16" y="231">Copilot · mcp</text>
      <rect class="flipFill" x="150" y="206" width="76" height="22" rx="11" fill="#D9F2E3"/>
      <text class="pill txtIn"  x="188" y="221" text-anchor="middle" fill="#137333">Installed</text>
      <text class="pill txtOut" x="188" y="221" text-anchor="middle" fill="#A50E0E">Removed</text>
    </g>
  </g>
</svg>
